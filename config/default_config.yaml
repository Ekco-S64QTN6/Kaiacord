# ==============================================================================
# Kaia — Default Configuration
# ==============================================================================
#
# Every key the application reads, with its shipped default. Do not edit this
# file to change behaviour — put overrides in config/kaia.yaml, which is
# resolved on top of it.
#
# Resolution order, highest priority first:
#   1. Environment variables (DISCORD_TOKEN, OLLAMA_HOST, …)
#   2. config/kaia.yaml
#   3. This file
#
# ==============================================================================

# ============================================================================
# Models Configuration
# ============================================================================
models:
  # Main chat model
  chat: "gemma3:12b"
  
  # Embedding model for RAG
  # nomic-embed-text-cpu runs CPU-only via num_gpu:0, preserving VRAM for the chat model.
  embedding: "nomic-embed-text-cpu"

  # There is no classification model. Intent is matched by regex in
  # IntentParser.fast_parse (utils/core/intent_classifier.py).

# ============================================================================
# Ollama Daemon
# ============================================================================
ollama:
  # Where the Ollama daemon listens. Every generation and embedding call goes
  # here; OLLAMA_HOST in the environment overrides it.
  host: "http://localhost:11434"

# ============================================================================
# Performance Configuration
# ============================================================================
performance:
  # Thread count for CPU-bound operations (Prompt prefill, Intent classification)
  # Default matches Ryzen 5 9600X (12 threads)
  num_thread: 12

  # Maximum messages to keep in memory per channel
  max_memory_messages: 35
  
  # Maximum number of quips to send in a single idle period
  max_consecutive_quips: 2
  
  # How often to quip when idle (in minutes)
  idle_quip_timeout_minutes: 55
  
  # Number of top RAG results to retrieve
  rag_top_k: 12

  # Half-life for user_logs/news recency decay (days). Higher = slower decay.
  rag_recency_half_life_days: 90
  
  # RAG Relevance Thresholds
  rag_thresholds:
    persona: 0.50
    user_identity: 0.50
    knowledge: 0.45
    casual_penalty: 0.10
    
  # RAG Node Configuration
  rag_node_chunk_size: 1024
  rag_node_chunk_overlap: 200

  # RAG Scoring Weights (Magic Numbers Extracted)
  rag_scoring:
    base_score_multiplier: 80.0
    path_boost: 0.5
    type_boosts:
      persona: 0.40
      user_profile: 0.20
      dream: 0.10
      user_logs: 0.10
      knowledge: 0.15
  
  # Requests per minute per user (rate limiting)
  requests_per_minute: 30

  
  # Maximum RAG log size (MB) before rotation
  max_log_size_mb: 1000

  # Total tokens for chat model (bumped from 12000 to use VRAM headroom)
  max_context_tokens: 16384

  
  # Context window for CPU-based embeddings (OllamaEmbedding)
  embedding_context_tokens: 2048

  # Summarization burst context (Temporarily expands for large file processing)
  # Safe for 12GB VRAM: 48,000
  summarization_context_tokens: 24000

  # Token estimation multiplier (words * multiplier = approx tokens)
  # 1.3 is a reasonable estimate for English text; adjust for other languages
  token_multiplier: 1.6

  # Reserved tokens for system reinforcement rules and safety prompts
  system_reserve_tokens: 1850

  # Maximum character limit to scrape from a single URL to prevent context explosion
  url_max_content_length: 8000

  # RAG Time-Based Boosts (Seconds)
  rag_boosts:
    daily_news: 172800  # 48 hours
    dreams: 64800       # 18 hours
    user_scan_interval: 300 # 5 minutes

# ============================================================================
# RAG retrieval
# ============================================================================
rag:
  # Instruction prefixes for embedding models
  # nomic-embed-text requires these prefixes for correct retrieval quality.
  # These are specific to nomic-embed-text and should be removed if switching to a different embedding model.
  query_instruction: "search_query: "
  text_instruction: "search_document: "

# ============================================================================
# Generation Configuration (Self-Healing Loop)
# ============================================================================
generation:
  # Maximum retry attempts for failed LLM calls
  max_retry_attempts: 3
  
  # Base temperature for generation (conversational chat)
  base_temperature: 0.7
  
  # Grounded temperature for RAG retrieval and document summarization
  rag_temperature: 0.35
  
  # Temperature added per retry attempt. A retry only happens when a guard
  # rejected the previous output, so this has to be large enough for the next
  # attempt to actually diverge — too small and the retry reproduces the
  # rejected text and burns an inference for nothing.
  temperature_scaling: 0.15
  
  # Fallback num_predict on context reduction
  fallback_num_predict: 512

  # Maximum tokens to generate in a response. This is *reserved* out of the
  # context window on every turn, so headroom here is taken directly from the
  # RAG and history budget. Measured over 352 real generations: p50=70,
  # p90=163, p99=265, max=852. Raise it only if replies hit the ceiling.
  max_response_tokens: 1024

# ============================================================================
# Timeouts Configuration
# ============================================================================
timeouts:
  # Query classification timeout (seconds)
  # The classifier uses a synchronous thread with this timeout
  classification_seconds: 35.0

  # Orchestration wait timeout for classification (seconds)
  # Should be classification_seconds + buffer for overhead
  orchestration_classification_seconds: 45.0

  # Join timeout for classification task (seconds)
  classification_join_seconds: 40.0

  # Model pre-warm timeout (seconds)
  prewarm_seconds: 30.0

  # RAG retrieval timeout (seconds)
  rag_retrieval_seconds: 30.0

  # Typing indicator duration (seconds)
  typing_indication_seconds: 2.0

  # Model load timeout (seconds) - for full context allocation
  model_load_seconds: 300.0

  # RAG internal lock timeout (seconds)
  rag_lock_seconds: 10.0

  # Chat generation timeout (seconds)
  chat_generation_seconds: 300.0

  # Embedding request timeout (seconds) - per-request timeout for OllamaEmbedding calls
  embedding_request_seconds: 60.0

  # LLM request timeout (seconds)
  llm_request_seconds: 600.0

  # Overall shutdown timeout (seconds) - how long to wait for async_shutdown to complete
  # Must be long enough for RAG persistence (~30s) plus model unloading
  shutdown_seconds: 120.0

  # URL fetch timeout (seconds) - max time to wait for a webpage to download
  url_fetch_seconds: 15.0

# ============================================================================
# Paths Configuration
# ============================================================================
paths:
  # Knowledge base directory
  knowledge_base: "./knowledge_base"
  
  # Persistence directory for indices and cache
  persist: "./memory/rag_storage"
  
  # Bot state file
  bot_state: "./memory/bot_state.json"
  
  
  # Dream thought cache file
  dream_cache: "./memory/dream_cache.json"

# ============================================================================
# Startup Configuration
# ============================================================================
startup:
  # Enable news updates at startup (DISABLED for faster boot)
  news_update: false
  
  # Timeout for news update (seconds)
  news_timeout: 10
  
  # Enable GPU memory cleanup at startup
  gpu_cleanup: true
  
  # Kill orphaned instances at startup
  kill_orphans: true

# ============================================================================
# Discord Configuration
# ============================================================================
discord:
  # Blacklisted channels (comma-separated)
  blacklisted_channels: "general,announcements,rules"
  
  # Command prefix
  command_prefix: "!"
  
  # Enable message content intent
  message_content_intent: true

  # Ignored users (comma-separated names or IDs)
  ignored_users: ""
  
  # Owner/Admin users who bypass cooldowns and can use admin commands.
  # Comma-separated account usernames or Discord user IDs.
  #
  # Server nicknames (display names) are NOT accepted — a member picks their
  # own nickname, so matching on it let anyone grant themselves admin by
  # renaming. Prefer the numeric user id: it is the only identifier a member
  # cannot change. The id below is Ekco's, kept alongside the username so a
  # username change cannot lock the operator out of admin commands.
  owner_ids: "ekco,177011971818782721"

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Enable structured logging (JSON format)
  structured: false
  
  # Enable request ID tracking
  request_ids: true
  
  # Log file path (empty for console only)
  file_path: ""

# ============================================================================
# Dashboard Configuration
# ============================================================================
dashboard:
  # Dashboard type (curses, ansi, none)
  type: "curses"
  
  # Update interval (seconds)
  update_interval: 1.5
  
  # Enable dashboard logging
  enable_logging: true
  
  # Fallback to ANSI if curses fails
  ansi_fallback: true

# ############################################################################
# SPEAKING UNPROMPTED
# ############################################################################
# Everything she says that nobody asked for goes through one system
# (utils/core/unprompted.py). Four sources feed it:
#
#   proactive     she starts a conversation            most active channel
#   quip          a remark when a channel goes quiet   most active channel
#                 (sometimes a thread of several posts)
#   observation   a summary of a conversation she      #kaia-opolis
#                 watched but did not join
#   monologue     one of her private thoughts          #kaia-opolis
#
# Each source still decides what to say and when to try — the proactive
# engine's desire gate (desires: below), the quip's idle timer
# (performance.idle_quip_timeout_minutes), the digest's count of new messages
# (observation: below), a thought every 15 minutes. Whether anything actually
# posts is decided once, here, for all four: the switches, one daily limit and
# one gap shared between them, and one set of posting hours.
unprompted:
  # Master switch. false = nothing unprompted posts at all.
  enabled: true

  # Which sources may post. A source switched off still runs — the monologue
  # still thinks and colours her replies, the digest is still written to
  # memory/observation_digest.json — you just never see it.
  sources:
    proactive: true
    quip: true
    observation: true
    monologue: true

  # One allowance shared by all four: at most this many posts a day, at least
  # this many minutes apart. 0 for max_per_day removes the daily limit.
  # A manual !quip is not unprompted and neither needs nor spends it.
  max_per_day: 8
  min_interval_minutes: 90

  # When true, nothing posts outside these local hours. 9 and 22 mean 09:00
  # until 21:59; start > end wraps midnight (22 and 6 = quiet overnight).
  respect_quiet_hours: false
  quiet_hour_start: 9
  quiet_hour_end: 22

  # Which sources are also posted to her Bluesky feed (bluesky.enabled must be
  # on too). Observations and proactive openers often name or quote people from
  # the server; turning them on puts that on a public feed. A "haven't seen you
  # in a while" check-in to a person is never cross-posted.
  bluesky:
    proactive: false
    quip: true
    observation: false
    monologue: false

  # The same for X (x_twitter.enabled must be on too).
  x:
    proactive: false
    quip: false
    observation: false
    monologue: false

  # ── Labels ──────────────────────────────────────────────────────────────
  # Every post goes out under one of these. Which one is picked from what the
  # post is — where it came from and what it says — with a little chance mixed
  # in, and never the same one twice in a row in a channel:
  #
  #   a belief she has changed, "i used to think…"        Unspooling
  #   something she read, "turns out…"                     Down the rabbit hole
  #   building on something someone said                   Train of thought
  #   a string of questions, "i wonder…"                   Thinking out loud
  #   a long post, or a thread of three or more            Long thought
  #   a one-liner                                          Passing thought
  #
  # Each source only wears labels that describe it honestly: an observation is
  # always an Observation, and a check-in to a person goes out with no label.
  #
  # false = no chance: each source always wears its own label (proactive →
  # Apropos of nothing, quip → Passing thought, a quip thread → Train of
  # thought, observation → Observation, monologue → Inner monologue).
  rotate: true

  # The wording, emoji first. Set one to "" to retire it.
  labels:
    observation: "💭 Observation"
    inner_monologue: "🧠 Inner monologue"
    apropos: "☕ Apropos of nothing"
    passing_thought: "💬 Passing thought"
    train_of_thought: "🧵 Train of thought"
    thinking_out_loud: "🦋 Thinking out loud"
    rabbit_hole: "🌀 Down the rabbit hole"
    unspooling: "🪡 Unspooling"
    long_thought: "📜 Long thought"

# When the observation digest is written. Whether it is posted is decided
# under unprompted: above.
observation:
  # How many new messages she has to have watched since the last summary
  # before she writes another one. Raise it for quieter servers.
  min_new_turns: 25

  # Most messages fed into one summary. Guards the token budget.
  max_turns_per_digest: 60

# ============================================================================
# Desire gate
# ============================================================================
desires:
  # Whether the needs vector may *block* her from speaking first.
  #
  # true  — she initiates once pressure clears initiate_threshold below.
  # false — decoration: needs still choose which source she reaches for
  #         (source_multiplier) and still colour the prompt, but they never
  #         stop her initiating.
  gate_enabled: true

  # Mean need pressure required to speak first, 0.0-1.0. Lower means she
  # initiates more often.
  #
  # Note the achievable range is narrow: `observe_exchange` discharges the
  # intellectual need by 0.35 on any reply over 400 characters and it re-accrues
  # over 14 hours, so on an active server the three-need mean tops out around
  # 0.16. A threshold above that silences her entirely.
  initiate_threshold: 0.12

# ============================================================================
# Knowledge base maintenance
# ============================================================================
knowledge_base:
  # Nightly pass that fills in missing summary and keywords on corpus files.
  # Runs in the dream window. Idempotent: only files still missing either
  # field are touched.
  auto_enrich: true

  # How many files each nightly pass enriches. Counted against files that
  # actually need work, not files scanned. One model call per file, at
  # BACKGROUND GPU priority. Raise it to drain a backlog faster.
  auto_enrich_limit: 60

  # Weekly pass that rolls closed months of user logs into monthly archives,
  # rebuilds the per-user folder READMEs, and logs the corpus audit's
  # findings. Deterministic — no model call.
  auto_hygiene: true

# ============================================================================
# Discord presence
# ============================================================================
presence:
  # How long without a human message before her Discord status must stop
  # claiming the room is busy. Ground truth beats the engagement average,
  # which is a slow float and lagged reality by hours.
  quiet_after_minutes: 20

# ============================================================================
# Feature Flags
# ============================================================================
features:
  # --- Identity injection ---
  # Kaia's character comes from knowledge_base/kaia_persona.md, injected every
  # turn and never truncated. The two blocks below are additional prepends on
  # top of it, and both come out of the retrieval budget.

  # Prepend memory/kaia_self_model.md (~1070 tokens/turn): her running notes on
  # the people she talks to. Overlaps relationship_manager, the personalization
  # engine and the per-user user_profile.md docs in RAG, and is written by the
  # model as well as read by it.
  self_model_injection: false

  # Prepend memory/kaia_constitution.md (~2500 tokens/turn): operating
  # principles the persona file does not state. The largest single block of
  # per-turn budget — turn it off if RAG recall needs the room.
  constitution_injection: true
  # Enable news system
  news_enabled: true
  
  # Enable auto news injection (DISABLED)
  news_auto_trigger: false
  
  # Enable hallucination detection
  hallucination_detection: true
  
  # Enable boilerplate filtering
  boilerplate_filtering: true
  
  # Enable Dream Mode (nightly associative memory recall)
  dream_mode_enabled: true

  # Fetch contents of URLs linked in chat for context
  url_fetching_enabled: true

  # Enable audit flag system for Data Rot construct tracking
  audit_flags_enabled: true

  # Enable conversation snapshot capture (!snapshot)
  snapshots_enabled: true

  # Enable Discord Presence system (mood-driven status updates)
  presence_enabled: true

  # --- Kaia's self-knowledge (off unless set to true) ---
  # At an extreme — the last prompt at 80%+ of the context window, social
  # energy below 0.15, no dream for two nights — she is given the real number
  # and may mention it. At most once per channel every two hours.
  real_telemetry: false

  # Every 3 hours her document-grounded claims are checked against their
  # sources. Off, a contradiction is only recorded (memory/self_corrections.jsonl,
  # "would correct" in the log); on, she posts one correction a day at most in
  # the channel where she said it.
  self_correction: false

  # Arousal moves conversation temperature by up to ±0.05, and low social
  # energy asks her to say less. Grounded answers are unaffected.
  mood_shapes_generation: false

# ============================================================================
# Audit & Quality Configuration
# ============================================================================
audit:
  # Score penalty per audit flag on a RAG node
  flag_penalty: 0.15

# ============================================================================
# Snapshot Configuration
# ============================================================================
snapshots:
  # Number of messages to capture in a snapshot
  message_count: 50

# ============================================================================
# Bluesky Configuration
# ============================================================================
bluesky:
  # Enable Bluesky. Requires BLUESKY_HANDLE and BLUESKY_APP_PASSWORD in .env;
  # credentials alone do nothing without this flag.
  enabled: false

  # What she posts to her feed is chosen under unprompted.bluesky.

  # Reply to mentions received on Bluesky.
  reply_to_mentions: false

# ============================================================================
# X (Twitter) Configuration
# ============================================================================
x_twitter:
  # Enable X. Requires X_USERNAME, X_PASSWORD and X_EMAIL in .env; credentials
  # alone do nothing without this flag.
  enabled: false

  # What she posts to X is chosen under unprompted.x.

  # Reply to mentions received on X.
  reply_to_mentions: false

# ============================================================================
# Social Media Polling
# ============================================================================
social:
  # Handles that bypass the per-thread reply limits. Read by
  # kaia_social_responder and social_bluesky_polling; it had no entry here, so
  # the only way to find the key was to grep the source.
  admin_handles: []
  # How often to check for mentions (in minutes)
  poll_interval_minutes: 3
  
  # How far back to look for mentions when starting/catching up (in hours)
  mention_lookback_hours: 2

  # Maximum number of posts in a generated thread (e.g. Bluesky/X)
  max_thread_posts: 5
# ============================================================================
# Dream Mode Configuration
# ============================================================================
dream_mode:
  # Weekly corpus curation, two hours after the dream window closes. Triage is
  # deterministic and always runs: anything in kaia_dreams/ that is not a
  # reflection is quarantined, since everything retrieved from that folder is
  # labelled to her as INTERNAL REFLECTION (DREAM) and feeds the next night.
  auto_curate: true

  # Reflections that must have accumulated before the expensive half — folding
  # the week's dreams into one document per book, person and topic — is worth a
  # model call.
  curate_min_new: 15

  # Groups consolidated per weekly pass. The work is resumable: each group is
  # archived as it finishes and an existing document is folded back in rather
  # than replaced, so a backlog is worked off over several weeks.
  curate_group_limit: 8

  # Schedule for nightly processing (24h format)
  schedule_start_hour: 3  # 3 AM
  schedule_end_hour: 5    # 5 AM
  
  # Cache limits
  max_dreams_cached: 1000
  dreams_per_scan: 10
  user_quota: 0.4 # Percentage of dreams dedicated to user logs
  
  # Minimum age of files to "dream" about (days)
  dream_age_min_days: 2
  
  # Mix ratio for trigger responses
  mix_ratio:
    recent: 0.25
    dreams: 0.50
    reflection: 0.25

  # Evening reflection pass — lightweight journal entry at 10-11pm
  evening_reflection_enabled: true
  evening_reflection_start_hour: 22
  evening_reflection_end_hour: 23

# ============================================================================
# VBulletin Forum Integration (Project 1999)
# ============================================================================
forum:
  # Main switch. Gates scraping and Off-Topic posting.
  enabled: false

  # Reading the forum. Posting depends on this: she will not reply in a place
  # she has not been reading (see min_threads/min_users_before_posting below).
  auto_scrape: false

  # Reply to questions in forum.allowed_threads. Answers on sight rather than
  # on interest, so it ignores min_interest_score below.
  auto_reply: false

  # Unsolicited answers in Technical Discussion, grounded in knowledge_base/
  # wiki and troubleshooting and footed with a disclaimer. The grounding is
  # not reliable; enabling this posts confident answers to strangers.
  tech_support_enabled: false

  # Forum details
  base_url: "https://www.project1999.com/forums"
  forum_id: 19  # Off Topic

  # Scraping settings
  scrape_interval_minutes: 30
  scrape_last_n_pages: 1
  max_posts_per_thread_scrape: 200
  max_pages_per_thread_scrape: 25
  full_scrape_max_pages: 50
  max_active_users_scrape: 15

  # ── Posting behaviour ──────────────────────────────────────────────────
  # Rate, timing and novelty limits on unsolicited posts. Together they set how
  # much like automation she reads to strangers on a public forum.

  # Local-time window. Wraps midnight: 0–4 means 00:00 to 03:59.
  post_window_start_hour: 0
  post_window_end_hour: 4

  # Spacing and daily cap for unsolicited posts. The task polls hourly; the
  # window above and the durable ledger (memory/forum_post_ledger.json) decide
  # whether a given poll posts anything.
  min_hours_between_posts: 4
  max_posts_per_day: 2

  # Never post into the same thread twice inside this many hours. Does not
  # apply to replies to someone who addressed her — see
  # min_minutes_between_replies below.
  thread_cooldown_hours: 72

  # Minimum interest score for a thread to be worth answering, scored from
  # overlap with her beliefs and anchors (forum_participation.score_thread).
  # When nothing on the front page clears it she posts nothing.
  #
  # Scale, measured against 81 real Off-Topic threads: 3.0 admits ~40% of them
  # (the AI and philosophy threads, not "Movies Thread" or "What are you
  # listening to?"); 2.0 admits ~86%, which is effectively no filter.
  min_interest_score: 3.0

  # Replying to someone who replied to her. This path ignores the posting
  # window, the daily cap and the thread cooldown above; the only guards are a
  # minimum interval and a requirement that something new was said, which bound
  # reply-on-reply against another bot.
  min_minutes_between_replies: 20

  # How long after one of her posts she keeps watching it for replies.
  reply_watch_days: 14

  # Other names people call her on the forum. A thread mentioning any of these
  # gets a large interest boost — interest is scored from her beliefs, so a
  # thread about her would otherwise score near zero on topic.
  also_known_as: []

  # How much a draft may resemble her own recent posts, 0.0-1.0, before it is
  # held back as repetitive.
  max_self_similarity: 0.5

  # Lurk requirement: how much of the forum must be in the scrape cache before
  # she posts at all. From a cold start this is roughly a day of scraping.
  min_threads_before_posting: 15
  min_users_before_posting: 25

# ============================================================================
# GENERATIVE MUSIC (!music)
# ============================================================================
# The sound engine is Strudel (https://codeberg.org/uzu/strudel, AGPL-3.0),
# run in a local headed browser and captured off a PipeWire null sink. Strudel
# is fetched as its own unmodified bundle by
# tools/maintenance/fetch_music_assets.py and no part of it lives in this repo.
#
# GPU cost is zero and this process stays light: the synthesis happens inside
# the browser, so the chat model keeps all of its VRAM.
music:
  enabled: true

  # Which genre `!music on` starts with when none is named. One of:
  # ambient, berlinschool, drumnbass, dub, house, lofi, synthwave, techno, trance
  default_genre: ambient

  # One stream at a time. Each session is a browser plus an ffmpeg capture.
  max_concurrent_sessions: 1

  # Show the Strudel editor window instead of parking it off-screen. The window
  # is the real Strudel REPL: it shows the running code, highlights whichever
  # pattern is sounding, draws the scope and piano roll, and exposes slider()
  # controls a human can ride mid-set. Hiding it changes nothing audible — she
  # narrates every move to the log either way.
  show_window: true

  # How long to hold the performance while somebody is typing in the editor.
  # Kaia will not apply her next move over a half-finished human edit, but she
  # will not wait forever either — an editor left dirty and abandoned would
  # otherwise freeze the set on one state.
  human_edit_grace_seconds: 180

  # Loop the capture sink back to this machine's speakers so a human at the
  # console can hear what is being broadcast. The null sink has no output
  # attached, so with this off the local machine is silent while Discord hears
  # the set.
  monitor_on_speakers: false

  # How long to let the first section come up before Discord starts pulling
  # frames. Below about four seconds the opening is audibly thin.
  prime_seconds: 6.0

  # Leave the channel this long after the last human does.
  alone_grace_seconds: 120

# ============================================================================
# Response filters
# ============================================================================
filters:
  # Extra names the bare-name opener guard should recognise. It discovers real
  # users from knowledge_base/user_logs; list here any nickname she uses that
  # does not appear there.
  extra_addressees:
    - gymconserve
    - kristinoemnclature
    - gnowmaticflux

# ============================================================================
# Radio — shortwave feeds, KiwiSDR listening, and the local RTL-SDR scanner
# ============================================================================
radio:
  # Master switch for !skyking, !numbers, !radio and the scheduled listens.
  enabled: true
  # Feeds (eam.watch, Priyom) are fetched at most this often.
  poll_hours: 6
  # Scheduled KiwiSDR recordings: HFGCS windows (UTC) and number stations.
  listen: true
  hfgcs_windows_utc: ["03:10", "09:10", "15:10", "21:10"]
  hfgcs_window_minutes: 20
  # Number stations followed, rotated: one recording per station a day.
  follow: ["E07", "V07", "S11A", "M12", "E11"]
  numbers_per_day: 6
  # UVB-76 calibration samples at night, kept in memory/radio/uvb76/.
  uvb76_samples: true
  # Catches are posted here; set post_clips false to keep them to the log.
  post_channel: kaia-opolis
  post_clips: true
  live_max_minutes: 60
  overnight_log: true
  overnight_time: "08:30"

  # The local RTL-SDR (utils/radio/scanner.py): a waterfall watch over the
  # voice bands during these local hours, writing what it catches to
  # memory/radio/local_ledger.sqlite3. !scanner shows it and plays presets.
  local:
    enabled: true
    hours: "00:00-06:00"
    gain: 40
    # The dongle's crystal error in parts per million. A generic RTL2832U can
    # sit tens of ppm off (50 ppm is 22 kHz at 444 MHz); measure it against a
    # known carrier such as NOAA and set it here.
    ppm: 0
    # Local repeaters to name in the ledger (RepeaterBook lists yours):
    #   - {mhz: 146.94, label: "W1XYZ repeater (FM, 100.0)", mode: fm}
    #   - {mhz: 443.4, label: "W1XYZ repeater (DMR)", mode: digital}
    channels: []
