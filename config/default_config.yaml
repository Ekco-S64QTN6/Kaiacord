# ==============================================================================
# Default Configuration
# ==============================================================================
#
# Hierarchical configuration with environment variable override support.
#
# This YAML file provides default configuration values. Environment variables
# and user config files can override these defaults.
# ==============================================================================

# ============================================================================
# Models Configuration
# ============================================================================
models:
  # Main chat model
  chat: "gemma3:12b"
  
  # Embedding model for RAG
  embedding: "nomic-embed-text"

# ============================================================================
# Performance Configuration
# ============================================================================
performance:
  # Maximum messages to keep in memory per channel
  max_memory_messages: 35
  
  # Maximum number of quips to send in a single idle period
  max_consecutive_quips: 2
  
  # How often to quip when idle (in minutes)
  idle_quip_timeout_minutes: 55
  
  # Number of top RAG results to retrieve
  rag_top_k: 25
  
  # RAG Relevance Thresholds
  rag_thresholds:
    persona: 0.50
    user_identity: 0.50
    knowledge: 0.45
    casual_penalty: 0.10

  # RAG Scoring Weights (Magic Numbers Extracted)
  rag_scoring:
    base_score_multiplier: 80.0
    path_boost: 0.5
    type_boosts:
      persona: 0.15
      user_profile: 0.20
      dream: 0.10
      memory: 0.25
  
  # Requests per minute per user (rate limiting)
  requests_per_minute: 30
  
  # Enable semantic cache
  enable_semantic_cache: true
  
  # Maximum RAG log size (MB) before rotation
  max_log_size_mb: 1000

  # Context budget (Total tokens for system prompt + history)
  # RTX 3060 (12GB) Recommended: 24,000 (More stable for concurrent RAG).
  max_context_tokens: 24000

  # Summarization burst context (Temporarily expands for large file processing)
  # Safe for 12GB VRAM: 48,000
  summarization_context_tokens: 48000

  # Token estimation multiplier (words * multiplier = approx tokens)
  # 1.3 is a reasonable estimate for English text; adjust for other languages
  token_multiplier: 1.3

  # Reserved tokens for system reinforcement rules and safety prompts
  system_reserve_tokens: 1250

  # RAG Time-Based Boosts (Seconds)
  rag_boosts:
    daily_news: 172800  # 48 hours
    dreams: 64800       # 18 hours
    user_scan_interval: 300 # 5 minutes

# ============================================================================
# Generation Configuration (Self-Healing Loop)
# ============================================================================
generation:
  # Maximum retry attempts for failed LLM calls
  max_retry_attempts: 3
  
  # Base temperature for generation
  base_temperature: 0.8
  
  # Temperature increment per retry attempt
  temperature_scaling: 0.15
  
  # Fallback num_predict on context reduction
  fallback_num_predict: 512

  # Maximum number of tokens to generate in a response
  max_response_tokens: 2048

# ============================================================================
# Timeouts Configuration
# ============================================================================
timeouts:
  # Query classification timeout (seconds)
  # The classifier uses a synchronous thread with this timeout
  classification_seconds: 35.0

  # Orchestration wait timeout for classification (seconds)
  # Should be classification_seconds + buffer for overhead
  orchestration_classification_seconds: 40.0

  # Join timeout for classification task (seconds)
  classification_join_seconds: 15.0

  # Model pre-warm timeout (seconds)
  prewarm_seconds: 30.0

  # RAG retrieval timeout (seconds)
  rag_retrieval_seconds: 30.0

  # Typing indicator duration (seconds)
  typing_indication_seconds: 2.0

  # Model load timeout (seconds) - for full context allocation
  model_load_seconds: 180.0

  # RAG internal lock timeout (seconds)
  rag_lock_seconds: 10.0

  # LLM request timeout (seconds)
  llm_request_seconds: 360.0

# ============================================================================
# Paths Configuration
# ============================================================================
paths:
  # Knowledge base directory
  knowledge_base: "./knowledge_base"
  
  # Persistence directory for indices and cache
  persist: "./storage"
  
  # Bot state file
  bot_state: "./memory/bot_state.json"
  
  # Semantic cache file
  semantic_cache: "./memory/semantic_cache.json"
  
  # Dream thought cache file
  dream_cache: "./memory/dream_cache.json"

# ============================================================================
# Startup Configuration
# ============================================================================
startup:
  # Enable news updates at startup (DISABLED for faster boot)
  news_update: false
  
  # Timeout for news update (seconds)
  news_timeout: 10
  
  # Enable GPU memory cleanup at startup
  gpu_cleanup: true
  
  # Kill orphaned instances at startup
  kill_orphans: true

# ============================================================================
# Discord Configuration
# ============================================================================
discord:
  # Blacklisted channels (comma-separated)
  blacklisted_channels: "general,announcements,rules"
  
  # Command prefix
  command_prefix: "!"
  
  # Enable message content intent
  message_content_intent: true

  # Ignored users (comma-separated names or IDs)
  ignored_users: ""
  
  # Owner/Admin users who bypass cooldowns and can use admin commands
  # Comma-separated usernames or Discord user IDs
  owner_ids: "ekco"

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Enable structured logging (JSON format)
  structured: false
  
  # Enable request ID tracking
  request_ids: true
  
  # Log file path (empty for console only)
  file_path: ""

# ============================================================================
# Dashboard Configuration
# ============================================================================
dashboard:
  # Dashboard type (curses, ansi, none)
  type: "curses"
  
  # Update interval (seconds)
  update_interval: 1.5
  
  # Enable dashboard logging
  enable_logging: true
  
  # Fallback to ANSI if curses fails
  ansi_fallback: true

# ============================================================================
# Feature Flags
# ============================================================================
features:
  # Enable news system
  news_enabled: true
  
  # Enable auto news injection (DISABLED)
  news_auto_trigger: false
  
  # Enable hallucination detection
  hallucination_detection: true
  
  # Enable boilerplate filtering
  boilerplate_filtering: true
  
  # Enable Dream Mode (nightly associative memory recall)
  dream_mode_enabled: true

# ============================================================================
# Bluesky Configuration
# ============================================================================
bluesky:
  # Enable Bluesky integration
  enabled: false
  
  # Cross-post idle quips to Bluesky
  cross_post_quips: false
  
  # Reply to mentions on Bluesky
  reply_to_mentions: false

# ============================================================================
# X (Twitter) Configuration
# ============================================================================
x_twitter:
  # Enable X integration
  enabled: false
  
  # Cross-post idle quips to X
  cross_post_quips: false
  
  # Reply to mentions on X
  reply_to_mentions: false

# ============================================================================
# Social Media Polling
# ============================================================================
social:
  # How often to check for mentions (in minutes)
  poll_interval_minutes: 3
  
  # How far back to look for mentions when starting/catching up (in hours)
  mention_lookback_hours: 2

  # Maximum number of posts in a generated thread (e.g. Bluesky/X)
  max_thread_posts: 5
# ============================================================================
# Dream Mode Configuration
# ============================================================================
dream_mode:
  # Schedule for nightly processing (24h format)
  schedule_start_hour: 3  # 3 AM
  schedule_end_hour: 5    # 5 AM
  
  # Cache limits
  max_dreams_cached: 50
  dreams_per_scan: 10
  user_quota: 0.4 # Percentage of dreams dedicated to user logs
  
  # Minimum age of files to "dream" about (days)
  dream_age_min_days: 2
  
  # Mix ratio for trigger responses
  mix_ratio:
    recent: 0.25
    dreams: 0.50
    reflection: 0.25

# ============================================================================
# VBulletin Forum Integration (Project 1999)
# ============================================================================
forum:
  # Main switch to enable/disable forum features
  enabled: true 
  
  # Whether to allow the bot to automatically respond to threads (not implemented yet)
  auto_reply: false
  
  # Forum details
  base_url: "https://www.project1999.com/forums"
  forum_id: 19  # Off Topic
  
  # Scraping settings
  scrape_interval_minutes: 30
  scrape_last_n_pages: 1
  max_posts_per_thread_scrape: 200
  max_pages_per_thread_scrape: 25
  full_scrape_max_pages: 50
  max_active_users_scrape: 15
  
  # Rate limiting for posting
  min_hours_between_posts: 4
  max_posts_per_day: 6
