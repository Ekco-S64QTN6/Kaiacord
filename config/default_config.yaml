# ==============================================================================
# Default Configuration
# ==============================================================================
#
# Hierarchical configuration with environment variable override support.
#
# This YAML file provides default configuration values. Environment variables
# and user config files can override these defaults.
# ==============================================================================

# ============================================================================
# Models Configuration
# ============================================================================
models:
  # Main chat model
  chat: "gemma3:12b"
  
  # Embedding model for RAG
  # nomic-embed-text-cpu runs CPU-only via num_gpu:0, preserving VRAM for the chat model.
  embedding: "nomic-embed-text-cpu"

  # Intent classification model
  classification_model: "gemma2:2b"

  # Whether to run intent classification on GPU (default: false, runs on CPU)
  classification_on_gpu: false

# ============================================================================
# Performance Configuration
# ============================================================================
performance:
  # Thread count for CPU-bound operations (Prompt prefill, Intent classification)
  # Default matches Ryzen 5 9600X (12 threads)
  num_thread: 12

  # Maximum messages to keep in memory per channel
  max_memory_messages: 35
  
  # Maximum number of quips to send in a single idle period
  max_consecutive_quips: 2
  
  # How often to quip when idle (in minutes)
  idle_quip_timeout_minutes: 55
  
  # Number of top RAG results to retrieve
  rag_top_k: 12

  # Half-life for user_logs/news recency decay (days). Higher = slower decay.
  rag_recency_half_life_days: 90
  
  # RAG Relevance Thresholds
  rag_thresholds:
    persona: 0.50
    user_identity: 0.50
    knowledge: 0.45
    casual_penalty: 0.10
    
  # RAG Node Configuration
  rag_node_chunk_size: 1024
  rag_node_chunk_overlap: 200

  # RAG Scoring Weights (Magic Numbers Extracted)
  rag_scoring:
    base_score_multiplier: 80.0
    path_boost: 0.5
    type_boosts:
      persona: 0.40
      user_profile: 0.20
      dream: 0.10
      user_logs: 0.10
      knowledge: 0.15
  
  # Requests per minute per user (rate limiting)
  requests_per_minute: 30

  
  # Maximum RAG log size (MB) before rotation
  max_log_size_mb: 1000

  # Total tokens for chat model (bumped from 12000 to use VRAM headroom)
  max_context_tokens: 16384

  # Context window for CPU-based classification (IntentParser)
  classification_context_tokens: 2048
  
  # Context window for CPU-based embeddings (OllamaEmbedding)
  embedding_context_tokens: 2048

  # Summarization burst context (Temporarily expands for large file processing)
  # Safe for 12GB VRAM: 48,000
  summarization_context_tokens: 24000

  # Token estimation multiplier (words * multiplier = approx tokens)
  # 1.3 is a reasonable estimate for English text; adjust for other languages
  token_multiplier: 1.6

  # Reserved tokens for system reinforcement rules and safety prompts
  system_reserve_tokens: 1850

  # Maximum character limit to scrape from a single URL to prevent context explosion
  url_max_content_length: 8000

  # RAG Time-Based Boosts (Seconds)
  rag_boosts:
    daily_news: 172800  # 48 hours
    dreams: 64800       # 18 hours
    user_scan_interval: 300 # 5 minutes

rag:
  # Instruction prefixes for embedding models
  # nomic-embed-text requires these prefixes for correct retrieval quality.
  # These are specific to nomic-embed-text and should be removed if switching to a different embedding model.
  query_instruction: "search_query: "
  text_instruction: "search_document: "

# ============================================================================
# Generation Configuration (Self-Healing Loop)
# ============================================================================
generation:
  # Maximum retry attempts for failed LLM calls
  max_retry_attempts: 3
  
  # Base temperature for generation (conversational chat)
  base_temperature: 0.7
  
  # Grounded temperature for RAG retrieval and document summarization
  rag_temperature: 0.35
  
  # Temperature increment per retry attempt.
  # A retry only happens when a guard REJECTED the previous output, so the retry needs to
  # actually diverge. At 0.05 attempt 3 was only base+0.10, which reproduced near-identical
  # text and burned a second inference for nothing. Restored to 0.15 (pre-2977554 value).
  temperature_scaling: 0.15
  
  # Fallback num_predict on context reduction
  fallback_num_predict: 512

  # Maximum number of tokens to generate in a response.
  # Measured over 352 real generations (Sept 2026): p50=70, p90=163, p99=265, max=852.
  # Nothing has ever exceeded 1024. This value is *reserved* out of the context window on
  # every turn, so 2048 was spending ~1200 tokens of RAG/history budget on headroom that
  # is never used. Raise it only if responses actually start hitting the ceiling.
  max_response_tokens: 1024

# ============================================================================
# Timeouts Configuration
# ============================================================================
timeouts:
  # Query classification timeout (seconds)
  # The classifier uses a synchronous thread with this timeout
  classification_seconds: 35.0

  # Orchestration wait timeout for classification (seconds)
  # Should be classification_seconds + buffer for overhead
  orchestration_classification_seconds: 45.0

  # Join timeout for classification task (seconds)
  classification_join_seconds: 40.0

  # Model pre-warm timeout (seconds)
  prewarm_seconds: 30.0

  # RAG retrieval timeout (seconds)
  rag_retrieval_seconds: 30.0

  # Typing indicator duration (seconds)
  typing_indication_seconds: 2.0

  # Model load timeout (seconds) - for full context allocation
  model_load_seconds: 300.0

  # RAG internal lock timeout (seconds)
  rag_lock_seconds: 10.0

  # Chat generation timeout (seconds)
  chat_generation_seconds: 300.0

  # Embedding request timeout (seconds) - per-request timeout for OllamaEmbedding calls
  embedding_request_seconds: 60.0

  # LLM request timeout (seconds)
  llm_request_seconds: 600.0

  # Overall shutdown timeout (seconds) - how long to wait for async_shutdown to complete
  # Must be long enough for RAG persistence (~30s) plus model unloading
  shutdown_seconds: 120.0

  # URL fetch timeout (seconds) - max time to wait for a webpage to download
  url_fetch_seconds: 15.0

# ============================================================================
# Paths Configuration
# ============================================================================
paths:
  # Knowledge base directory
  knowledge_base: "./knowledge_base"
  
  # Persistence directory for indices and cache
  persist: "./memory/rag_storage"
  
  # Bot state file
  bot_state: "./memory/bot_state.json"
  
  
  # Dream thought cache file
  dream_cache: "./memory/dream_cache.json"

# ============================================================================
# Startup Configuration
# ============================================================================
startup:
  # Enable news updates at startup (DISABLED for faster boot)
  news_update: false
  
  # Timeout for news update (seconds)
  news_timeout: 10
  
  # Enable GPU memory cleanup at startup
  gpu_cleanup: true
  
  # Kill orphaned instances at startup
  kill_orphans: true

# ============================================================================
# Discord Configuration
# ============================================================================
discord:
  # Blacklisted channels (comma-separated)
  blacklisted_channels: "general,announcements,rules"
  
  # Command prefix
  command_prefix: "!"
  
  # Enable message content intent
  message_content_intent: true

  # Ignored users (comma-separated names or IDs)
  ignored_users: ""
  
  # Owner/Admin users who bypass cooldowns and can use admin commands.
  # Comma-separated account usernames or Discord user IDs.
  #
  # Server nicknames (display names) are NOT accepted — a member picks their
  # own nickname, so matching on it let anyone grant themselves admin by
  # renaming. Prefer the numeric user id: it is the only identifier a member
  # cannot change. The id below is Ekco's, kept alongside the username so a
  # username change cannot lock the operator out of admin commands.
  owner_ids: "ekco,177011971818782721"

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Enable structured logging (JSON format)
  structured: false
  
  # Enable request ID tracking
  request_ids: true
  
  # Log file path (empty for console only)
  file_path: ""

# ============================================================================
# Dashboard Configuration
# ============================================================================
dashboard:
  # Dashboard type (curses, ansi, none)
  type: "curses"
  
  # Update interval (seconds)
  update_interval: 1.5
  
  # Enable dashboard logging
  enable_logging: true
  
  # Fallback to ANSI if curses fails
  ansi_fallback: true

# ============================================================================
# Passive Observation Digest
# ============================================================================
# Kaia periodically summarises conversation she overheard but did not take part
# in. The digest is triggered by how much NEW material has accumulated, not by
# the clock — a fixed 2-hour loop re-summarised the same trailing window and
# produced near-duplicate entries whenever the channel was quiet.
observation:
  # New observed turns that must accumulate past the last digest's watermark
  # before another digest is generated. Raise it for quieter servers.
  min_new_turns: 25

  # Hard cap on turns fed to the model in one digest (token guard).
  max_turns_per_digest: 60

  # Say the digest out loud instead of only writing it to
  # memory/observation_digest.json. Set false to keep it background-only.
  broadcast_digest: true

  # Broadcast budget. Independent of the general proactive allowance so a
  # digest is not crowded out by the other proactive sources, but still
  # bounded. Quiet hours from the proactive engine always apply.
  max_broadcasts_per_day: 3
  broadcast_min_interval_minutes: 120

# ============================================================================
# Feature Flags
# ============================================================================
features:
  # --- Identity injection (Sept 2026 token audit) ---
  # Kaia's character comes from knowledge_base/kaia_persona.md, which is injected on every
  # turn and never truncated. These two blocks are *additional* prepends on top of it.
  #
  # self_model_injection: memory/kaia_self_model.md (~1070 tokens/turn). Disabled by default.
  #   Its per-user observations duplicate three channels that are already injected and are
  #   better grounded: relationship_manager.format_for_injection(), personalization_engine
  #   .adapt_prompt(user_traits), and the per-user user_profile.md docs in RAG (which carry
  #   the highest type boost, 0.20). It is also auto-written by the model and then re-read
  #   by the model, so its stylistic tics feed back into generation.
  self_model_injection: false
  #
  # constitution_injection: memory/kaia_constitution.md (~2500 tokens/turn). Left ON, since
  # it states operating principles the persona file does not. Turn it off to reclaim the
  # largest single block of per-turn budget if RAG recall needs the room.
  constitution_injection: true
  # Enable news system
  news_enabled: true
  
  # Enable auto news injection (DISABLED)
  news_auto_trigger: false
  
  # Enable hallucination detection
  hallucination_detection: true
  
  # Enable boilerplate filtering
  boilerplate_filtering: true
  
  # Enable Dream Mode (nightly associative memory recall)
  dream_mode_enabled: true

  # Fetch contents of URLs linked in chat for context
  url_fetching_enabled: true

  # Enable audit flag system for Data Rot construct tracking
  audit_flags_enabled: true

  # Enable conversation snapshot capture (!snapshot)
  snapshots_enabled: true

  # Enable idle quip generation (timer-based broadcasts). Manual !quip still works.
  idle_quips_enabled: false

  # Enable Discord Presence system (mood-driven status updates)
  presence_enabled: true

# ============================================================================
# Audit & Quality Configuration
# ============================================================================
audit:
  # Score penalty per audit flag on a RAG node
  flag_penalty: 0.15

# ============================================================================
# Snapshot Configuration
# ============================================================================
snapshots:
  # Number of messages to capture in a snapshot
  message_count: 50

# ============================================================================
# Bluesky Configuration
# ============================================================================
bluesky:
  # Enable Bluesky integration.
  # Default off: the account this was built against was deleted, and with it on
  # the poster fails every cycle ("1 validation error for Main") and eventually
  # trips the circuit breaker. config/kaia.yaml already overrides this to false;
  # the default matched the old reality, so a fresh install turned it back on.
  enabled: false
  
  # Cross-post idle quips to Bluesky
  cross_post_quips: false
  
  # Reply to mentions on Bluesky
  reply_to_mentions: false

# ============================================================================
# X (Twitter) Configuration
# ============================================================================
x_twitter:
  # Enable X integration
  enabled: false
  
  # Cross-post idle quips to X
  cross_post_quips: false
  
  # Reply to mentions on X
  reply_to_mentions: false

# ============================================================================
# Social Media Polling
# ============================================================================
social:
  # How often to check for mentions (in minutes)
  poll_interval_minutes: 3
  
  # How far back to look for mentions when starting/catching up (in hours)
  mention_lookback_hours: 2

  # Maximum number of posts in a generated thread (e.g. Bluesky/X)
  max_thread_posts: 5
# ============================================================================
# Dream Mode Configuration
# ============================================================================
dream_mode:
  # Schedule for nightly processing (24h format)
  schedule_start_hour: 3  # 3 AM
  schedule_end_hour: 5    # 5 AM
  
  # Cache limits
  max_dreams_cached: 1000
  dreams_per_scan: 10
  user_quota: 0.4 # Percentage of dreams dedicated to user logs
  
  # Minimum age of files to "dream" about (days)
  dream_age_min_days: 2
  
  # Mix ratio for trigger responses
  mix_ratio:
    recent: 0.25
    dreams: 0.50
    reflection: 0.25

  # Evening reflection pass — lightweight journal entry at 10-11pm
  evening_reflection_enabled: true
  evening_reflection_start_hour: 22
  evening_reflection_end_hour: 23

# ============================================================================
# VBulletin Forum Integration (Project 1999)
# ============================================================================
forum:
  # Main switch. Gates scraping and Off-Topic posting.
  enabled: true

  # Reading the forum. Posting depends on this: she will not reply in a place
  # she has not been reading (see min_threads/min_users_before_posting below).
  auto_scrape: true

  # Reply to questions in forum.allowed_threads. Off: it answers on sight
  # rather than on interest, which is the behaviour people read as a bot.
  auto_reply: false

  # Unsolicited answers in Technical Discussion. Off deliberately — this ran
  # without staying inside the wiki and tech docs it was supposed to be
  # grounded in, and giving strangers confidently wrong EQ advice is worse
  # than saying nothing. Do not re-enable without fixing the grounding.
  tech_support_enabled: false
  
  # Forum details
  base_url: "https://www.project1999.com/forums"
  forum_id: 19  # Off Topic
  
  # Scraping settings
  scrape_interval_minutes: 30
  scrape_last_n_pages: 1
  max_posts_per_thread_scrape: 200
  max_pages_per_thread_scrape: 25
  full_scrape_max_pages: 50
  max_active_users_scrape: 15
  
  # ── Posting behaviour ──────────────────────────────────────────────────
  # Kaia posts on a public forum among strangers who did not ask to hear from
  # her, so the bar is "a welcome contribution from a person". These settings
  # exist to keep her from reading as automation.

  # Local-time window. Wraps midnight: 0–4 means 00:00 to 03:59.
  post_window_start_hour: 0
  post_window_end_hour: 4

  # A couple of posts a night, well spaced. The task polls hourly; the window
  # and the durable ledger (memory/forum_post_ledger.json) decide whether
  # anything happens.
  min_hours_between_posts: 4
  max_posts_per_day: 2

  # Never reply into the same thread twice inside this many hours. Repeated
  # replies in one thread are the clearest bot tell, and nothing previously
  # prevented it.
  thread_cooldown_hours: 72

  # Minimum interest score for a thread to be worth answering, computed from
  # overlap with her beliefs and anchors (see forum_participation.score_thread).
  # If nothing on the front page clears it, she posts nothing — which is the
  # correct behaviour, not a failure.
  #
  # Calibrated against the 81 real Off-Topic threads in the corpus: at 3.0
  # roughly 40% are eligible, the AI/philosophy threads clear it comfortably,
  # and "Movies Thread" / "Daily dose of eggdog" / "What are you listening to?"
  # sit below it. At the previous 2.0 — before term distinctiveness was
  # measured — 86% of threads cleared, so the "nothing tonight" valve never
  # actually fired.
  min_interest_score: 3.0

  # Conversation, as distinct from interjecting. Answering someone who
  # answered her is not rate-limited, windowed, or subject to the thread
  # cooldown — she is not capped in Discord either, and going quiet for three
  # days after someone replies to you is rude, not restrained. The only guard
  # is a short interval plus a requirement that something new was actually
  # said, which exists solely to bound reply-on-reply if she ever ends up
  # talking to another bot.
  min_minutes_between_replies: 20
  reply_watch_days: 14

  # Other names people call her on the forum. Threads mentioning any of these
  # get a large interest boost: interest is scored from her beliefs, so a
  # thread *about* her scores near zero on topic while being the clearest case
  # where a reply is wanted.
  also_known_as: []

  # How much a draft may resemble her recent posts before it is held back.
  # Nothing measured this before; in Discord the equivalent blind spot showed
  # up as a bare-name opener on 22.4% of turns.
  max_self_similarity: 0.5

  # Lurk before posting. She stays silent until she has read this much of the
  # forum, which after a fresh start takes roughly a day of scraping. Someone
  # whose first act in a community is to post has not read the room.
  min_threads_before_posting: 15
  min_users_before_posting: 25
