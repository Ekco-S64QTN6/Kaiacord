      - {mhz: 223.9000, label: "KB5WB repeater (FM, 110.9)", mode: fm}
      - {mhz: 224.8000, label: "K5SLD repeater (FM, 110.9)", mode: fm}
      - {mhz: 441.3375, label: "KF5UGN repeater (DMR)", mode: digital}
      - {mhz: 441.3500, label: "NR5E repeater (FM)", mode: fm}
      - {mhz: 443.4000, label: "WA5TV repeater (DMR)", mode: digital}
      - {mhz: 443.6750, label: "AI5TX repeater (FM)", mode: fm}
