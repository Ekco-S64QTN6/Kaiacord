# Kaia User Configuration
#
# This file is for user overrides only.
# 
# Hierarchy (highest to lowest priority):
# 1. Environment variables (e.g., DISCORD_TOKEN)
# 2. This file (config/kaia.yaml)
# 3. Default config (config/default_config.yaml)
#
models:
  chat: "gemma3:12b"

startup:
  news_update: true

discord:
  whitelisted_channels: "kaia-opolis,aethelgard"
  rpg_channel: "aethelgard"
  ignored_users:
    #- "Thorondor_470028550951403531"
    #- "470028550951403531"

# Bluesky: DISABLED — the @kaiakuroshi.bsky.social account was deleted (Sept 2026).
# Leaving this on produced repeated login attempts, fetch timeouts and circuit-breaker
# trips in logs/kaiacord.log for an account that no longer exists.
bluesky:
  enabled: true
  cross_post_quips: true
  # Still off: replying to strangers' mentions is a different risk from
  # broadcasting her own posts, and was not part of turning quips back on.
  reply_to_mentions: false

social:
  poll_interval_minutes: 1
  admin_handles: ["ekco-thewizard.bsky.social", "michaelschellhorn.link"]

# X/Twitter: @KaiaKuroshi. Credentials in .env (X_USERNAME / X_EMAIL /
# X_PASSWORD); twikit authenticates with browser session cookies cached at
# memory/x_cookies.json — see docs/04-security/x-twikit-credentials.md.
x_twitter:
  # OFF, and not because of the account — @KaiaKuroshi and its credentials are
  # fine, and is_x_configured() passes. twikit 2.3.3 (the latest release) can
  # no longer talk to X at all: x.com returns HTTP 200 but twikit's
  # ON_DEMAND_FILE_REGEX no longer matches anything in the page, so
  # ClientTransaction.get_indices raises "Couldn't get KEY_BYTE indices".
  # That transaction id is generated for *every* request, not just login, so
  # importing browser cookies does not get around it either.
  #
  # Flip both to true once a twikit release fixes it — nothing else needs
  # changing, the cross-post path is wired and tested.
  enabled: false
  cross_post_quips: false
  # Still off: replying to strangers' mentions is a different risk from
  # broadcasting her own posts, and matches how bluesky is set.
  reply_to_mentions: false
features:
  dream_mode_enabled: true
  # She quips into chat when things go quiet; bluesky.cross_post_quips above
  # mirrors it to her feed. Both the quip and the thread now generate through
  # the same pipeline Discord and the forum use.
  idle_quips_enabled: true

timeouts:
  classification_seconds: 60.0
  # Model load timeout (seconds) - for full context allocation
  model_load_seconds: 300.0
  chat_generation_seconds: 180.0
  llm_request_seconds: 120.0
  rag_retrieval_seconds: 45.0
  embedding_request_seconds: 90.0

performance:
  max_consecutive_quips: 5
  idle_quip_timeout_minutes: 160
  url_max_content_length: 8000
  num_thread: 6
  rag_scoring:
    type_boosts:
      persona: 0.15
      user_profile: 0.20
      dream: 0.10
      kaia_reflection: 0.30
      user_logs: 0.10
      knowledge: 0.15

forum:
  # On. Every auto-generated post lands in #kaia-opolis as a draft with
  # Accept/Reject buttons — nothing reaches the forum without a human press.
  enabled: true
  auto_scrape: true

  # Left OFF on purpose. Unsolicited answers in Technical Discussion ran
  # without staying grounded in the wiki and tech docs, and confidently wrong
  # EQ advice to strangers is worse than silence. The default_config comment
  # says not to re-enable it without fixing the grounding first, and that has
  # not been done.
  tech_support_enabled: false

# How readily she speaks first. The threshold was 0.55, which was arithmetically
# unreachable on an active server — she initiated once in 102 evaluations. Drop
# initiate_threshold further, or set gate_enabled false, if she is still quiet.
desires:
  gate_enabled: true
  initiate_threshold: 0.12

# What she says unprompted. Two separate switches on purpose: the digest is a
# few considered summaries a day, the monologue is a passing thought every
# fifteen minutes. Turn the monologue off and the observations stay.
observation:
  # Summaries of what she noticed, aired in #kaia-opolis.
  broadcast_digest: true

monologue:
  # Passing thoughts, aired in #kaia-opolis. The noisier of the two.
  broadcast_to_chat: true

generation:
  # base_temperature applies to ordinary conversation; rag_temperature only to
  # document-grounded work (see is_grounded in message_processor.py).
  base_temperature: 0.7
  rag_temperature: 0.35
  temperature_scaling: 0.15
