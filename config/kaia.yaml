# IMPORTANT: Keep secrets in your .env file, not here!
# Use ${ENV_VAR_NAME} syntax to reference environment variables.
#
# Example overrides:
# discord:
#   blacklisted_channels: "general,announcements"
# 
# models:
#   chat: "gemma3:12b"
#
