# ==============================================================================
# Kaia — User Configuration
# ==============================================================================
#
# Overrides only. Anything absent here falls through to
# config/default_config.yaml, which documents every key in full.
#
# Resolution order, highest priority first:
#   1. Environment variables (DISCORD_TOKEN, OLLAMA_HOST, …)
#   2. This file
#   3. config/default_config.yaml
#
# ==============================================================================

# ============================================================================
# Models
# ============================================================================
models:
  # Chat model, as named to Ollama.
  chat: "gemma3:12b"

# ============================================================================
# Performance
# ============================================================================
performance:
  # Idle quips: how many may go out in one idle period, and how long the
  # channel must be quiet first.
  max_consecutive_quips: 5
  idle_quip_timeout_minutes: 160

  # Characters kept from a URL fetched out of chat.
  url_max_content_length: 24000

  # Turns kept per channel. The history budget is what actually limits how far
  # back she can see, but this caps how many turns exist to choose from.
  max_memory_messages: 70

  # Context window. With Ollama's KV cache at q8_0 (OLLAMA_KV_CACHE_TYPE in its
  # service config) each 1k tokens costs ~33 MiB of VRAM on top of ~8.3 GiB of
  # weights, vision encoder and buffers: 24576 measured 9,356 MiB for the whole
  # model, 32768 adds ~270 MiB to that. Keep ~1 GiB free for the desktop,
  # browser and Discord — check with nvidia-smi after changing it. 24576 is
  # the known-good fallback.
  max_context_tokens: 32768

  # Ollama CPU threads. Below the core count, to leave headroom for the
  # embedding model and the rest of the machine.
  num_thread: 6

  rag_scoring:
    # Score added to a retrieved node by source type, before ranking.
    type_boosts:
      persona: 0.15
      user_profile: 0.20
      dream: 0.10
      kaia_reflection: 0.30
      user_logs: 0.10
      knowledge: 0.15

# ============================================================================
# Generation
# ============================================================================
generation:
  # base_temperature applies to ordinary conversation; rag_temperature only to
  # document-grounded work (see is_grounded in message_processor.py).
  base_temperature: 0.7
  rag_temperature: 0.35

  # Added per retry after a guard rejects an output.
  temperature_scaling: 0.15

# ============================================================================
# Timeouts (seconds)
# ============================================================================
timeouts:
  classification_seconds: 60.0

  # Cold model load, which allocates the full context window.
  model_load_seconds: 300.0

  chat_generation_seconds: 180.0
  llm_request_seconds: 120.0
  rag_retrieval_seconds: 60.0
  embedding_request_seconds: 90.0

# ============================================================================
# Startup
# ============================================================================
startup:
  # Fetch the news brief on boot.
  news_update: true

# ============================================================================
# Discord
# ============================================================================
discord:
  # Channels she reads and replies in. Comma-separated names, no '#'.
  whitelisted_channels: "kaia-opolis,aethelgard"

  # Channel the TTRPG runs in.
  rpg_channel: "aethelgard"

  # Accounts she ignores entirely. Either "name_id" or a bare user id.
  ignored_users:
    #- "exampleName_470028550951403531"
    #- "470028550951403531"

# ============================================================================
# Desire gate
# ============================================================================
desires:
  # Whether need pressure may block her from speaking first at all.
  gate_enabled: true

  # Mean pressure required to initiate, 0.0-1.0. The achievable range is
  # narrow — see the note in default_config.yaml.
  initiate_threshold: 0.12

# ============================================================================
# Speaking unprompted
# ============================================================================
# Everything she says that nobody asked for — proactive openers, quips and
# quip threads, observations, monologue thoughts — goes through one system
# with one set of limits. Full notes on each setting, and the list of labels
# her posts rotate through, are under unprompted: in default_config.yaml.
unprompted:
  enabled: true

  # Which sources may post. Switched off, the monologue still thinks and the
  # digest is still written — you just never see them.
  sources:
    proactive: true
    quip: true
    observation: true
    monologue: true

  # Shared by all four: at most this many posts a day, this many minutes apart.
  max_per_day: 16
  min_interval_minutes: 45

  # true = nothing posts outside quiet_hour_start..quiet_hour_end (local).
  respect_quiet_hours: false

  # Also posted to her Bluesky feed. Observations and proactive openers often
  # name or quote people from the server. Check-ins to a person never go.
  bluesky:
    proactive: true
    quip: true
    observation: true
    monologue: true

# ============================================================================
# Feature flags
# ============================================================================
features:
  # Nightly associative recall over the corpus.
  dream_mode_enabled: true

  # The constitution block costs ~2,200 tokens of every prompt, taken off the
  # top before RAG and history split what is left. Off, that goes to history.
  constitution_injection: false

  # She may state real readings about herself at extremes.
  real_telemetry: true

  # She posts a correction when a source contradicts something she said.
  self_correction: true


# ============================================================================
# Bluesky
# ============================================================================
# Credentials in .env (BLUESKY_HANDLE / BLUESKY_APP_PASSWORD); the flag below
# is what actually enables the integration.
bluesky:
  enabled: true

  # What she posts there is chosen under unprompted.bluesky above.

  # Reply to mentions from strangers. Separate from broadcasting her own posts.
  reply_to_mentions: false

# ============================================================================
# X (Twitter)
# ============================================================================
# @KaiaKuroshi. Credentials in .env (X_USERNAME / X_EMAIL / X_PASSWORD);
# twikit authenticates with browser session cookies cached at
# memory/x_cookies.json — see docs/04-security/x-twikit-credentials.md.
#
# Known blocker: twikit 2.3.3 cannot reach x.com. Its ON_DEMAND_FILE_REGEX no
# longer matches the page, so ClientTransaction.get_indices raises "Couldn't
# get KEY_BYTE indices" on every request, login or not. Imported cookies do
# not avoid it.
x_twitter:
  enabled: false

  # Reply to mentions from strangers.
  reply_to_mentions: false

# ============================================================================
# Social polling
# ============================================================================
social:
  # Minutes between mention checks across enabled platforms.
  poll_interval_minutes: 1

  # Handles whose mentions are treated as coming from an operator.
  admin_handles: ["ekco-thewizard.bsky.social", "michaelschellhorn.link"]

# ============================================================================
# Forum (Project 1999)
# ============================================================================
# Every auto-generated post lands in #kaia-opolis as a draft with
# Accept/Reject buttons; nothing reaches the forum without a human press.
forum:
  # Main switch. Gates scraping and Off-Topic posting.
  enabled: false

  # Reading the forum. Posting depends on it.
  auto_scrape: false

  # Unsolicited answers in Technical Discussion. The grounding is not
  # reliable — see default_config.yaml.
  tech_support_enabled: false

# ============================================================================
# SKY (!iss passes, !sky)
# ============================================================================
sky:
  # Observer for visible ISS passes and tonight's sky: a city is enough.
  location: "32.78, -96.80"   # Dallas, Texas

# ============================================================================
