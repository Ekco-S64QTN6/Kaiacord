# Kaia User Configuration
#
# This file is for user overrides only.
# 
# Hierarchy (highest to lowest priority):
# 1. Environment variables (e.g., DISCORD_TOKEN)
# 2. This file (config/kaia.yaml)
# 3. Default config (config/default_config.yaml)
#
models:
  chat: "gemma3:12b"

startup:
  news_update: true

discord:
  whitelisted_channels: "kaia-opolis,aethelgard"
  rpg_channel: "aethelgard"
  ignored_users:
    #- "Thorondor_470028550951403531"
    #- "470028550951403531"

# Bluesky: DISABLED — the @kaiakuroshi.bsky.social account was deleted (Sept 2026).
# Leaving this on produced repeated login attempts, fetch timeouts and circuit-breaker
# trips in logs/kaiacord.log for an account that no longer exists.
bluesky:
  enabled: false
  cross_post_quips: false
  reply_to_mentions: false

social:
  poll_interval_minutes: 1
  admin_handles: ["ekco-thewizard.bsky.social", "michaelschellhorn.link"]

# X/Twitter: DISABLED — unused.
x_twitter:
  enabled: false
  cross_post_quips: false
  reply_to_mentions: false
features:
  dream_mode_enabled: true

timeouts:
  classification_seconds: 60.0
  # Model load timeout (seconds) - for full context allocation
  model_load_seconds: 300.0
  chat_generation_seconds: 180.0
  llm_request_seconds: 120.0
  rag_retrieval_seconds: 45.0
  embedding_request_seconds: 90.0

performance:
  max_consecutive_quips: 5
  idle_quip_timeout_minutes: 160
  url_max_content_length: 8000
  num_thread: 6
  rag_scoring:
    type_boosts:
      persona: 0.15
      user_profile: 0.20
      dream: 0.10
      kaia_reflection: 0.30
      user_logs: 0.10
      knowledge: 0.15

forum:
  auto_scrape: false

generation:
  # base_temperature applies to ordinary conversation; rag_temperature only to
  # document-grounded work (see is_grounded in message_processor.py).
  base_temperature: 0.7
  rag_temperature: 0.35
  temperature_scaling: 0.15
