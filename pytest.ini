[pytest]
# Test discovery. Without testpaths, a bare `pytest` also walks venv/ and
# test_venv/, which is why the suite was always invoked with an explicit path.
testpaths = tools/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: pin the loop scope rather than inheriting a deprecation
# warning on every run.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Markers are declared here, not in conftest, and enforced. `--strict-markers`
# turns a typo'd marker into an error instead of a silently ignored one.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    slow: takes more than a couple of seconds (deselect with -m "not slow")
    gpu: requires a GPU and a loaded model
    ollama: requires a running Ollama daemon
    network: reaches the public internet
    integration: exercises more than one subsystem together

filterwarnings =
    ignore::DeprecationWarning:audioop
