<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIA // RX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04060c; --panel: #0a0e19; --panel2: #0d1322; --line: #18223a;
  --cyan: #00f0ff; --pink: #ff2fd1; --green: #3dff8a; --yellow: #ffe45c; --red: #ff3860;
  --purple: #a259ff; --text: #d6e2ff; --dim: #5d6b8f; --faint: #2a3554;
  --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --disp: "Orbitron", "JetBrains Mono", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(0,240,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.035) 1px, transparent 1px);
  background-size: 32px 32px; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
#app { position: relative; z-index: 1; display: grid; height: 100%; padding: 10px 12px 12px; gap: 10px;
  grid-template-rows: 44px auto 1fr; grid-template-columns: 1fr 400px; }
header { grid-column: 1 / span 2; display: flex; align-items: center; gap: 14px; padding: 0 6px; }
.logo { font-family: var(--disp); font-weight: 900; font-size: 22px; letter-spacing: 4px; color: var(--cyan);
  text-shadow: 0 0 8px rgba(0,240,255,.8), 2px 0 0 rgba(255,47,209,.7), -2px 0 0 rgba(61,255,138,.35); }
.logo span { color: var(--pink); text-shadow: 0 0 8px rgba(255,47,209,.9); }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px;
  font-size: 12px; color: var(--dim); letter-spacing: 1px; background: rgba(10,14,25,.7); white-space: nowrap; }
.pill b { color: var(--text); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.2s infinite; }
.dot.hold { background: var(--pink); box-shadow: 0 0 10px var(--pink); animation: pulse .6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.spacer { flex: 1; }
#clock { font-family: var(--disp); font-size: 18px; color: var(--green); text-shadow: 0 0 8px rgba(61,255,138,.6); letter-spacing: 2px; }
.panel { position: relative; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
  border-radius: 4px; box-shadow: inset 0 0 40px rgba(0,0,0,.6); overflow: hidden; }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: var(--accent, var(--cyan)); opacity: .8; z-index: 3; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }
.ptitle { font-family: var(--disp); font-size: 10px; letter-spacing: 3px; color: var(--dim); }

/* VFO */
#vfo { grid-column: 1; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 10px 16px; --accent: var(--pink); }
#freq { font-family: var(--disp); font-weight: 700; font-size: 52px; letter-spacing: 3px; color: var(--cyan); text-shadow: 0 0 16px rgba(0,240,255,.6); line-height: 1; }
#freq small { font-size: 18px; color: var(--dim); margin-left: 8px; letter-spacing: 2px; }
#freq.hold { color: var(--pink); text-shadow: 0 0 16px rgba(255,47,209,.7); }
.vsub { font-size: 12px; color: var(--dim); letter-spacing: 1.5px; margin-top: 6px; }
.vsub b { color: var(--text); }
.meters { display: grid; gap: 6px; min-width: 260px; }
.meter { display: grid; grid-template-columns: 54px 1fr 64px; gap: 8px; align-items: center; font-size: 10px; letter-spacing: 1.5px; color: var(--dim); }
.meter canvas { width: 100%; height: 14px; display: block; }
.meter .v { color: var(--text); text-align: right; }
.ctl { display: grid; gap: 6px; justify-items: end; }
.btn { font-family: var(--disp); font-size: 11px; letter-spacing: 2px; color: var(--dim); background: rgba(0,0,0,.4); cursor: pointer;
  border: 1px solid var(--faint); border-radius: 3px; padding: 7px 12px; user-select: none; white-space: nowrap; }
.btn:hover { color: var(--text); border-color: var(--cyan); }
.btn.lit { color: #031; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.6); }
.btn.pink.lit { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 12px rgba(255,47,209,.6); color: #200; }
.row { display: flex; gap: 6px; align-items: center; }
select { background: rgba(0,0,0,.5); color: var(--text); border: 1px solid var(--faint); font-family: var(--mono); font-size: 11px; padding: 5px; border-radius: 3px; }

/* Kaia */
#kaia { grid-column: 2; padding: 10px 14px; --accent: var(--purple); display: grid; grid-template-rows: auto 1fr; gap: 6px; }
#say { font-size: 12px; line-height: 1.5; border-left: 2px solid var(--pink); padding-left: 9px; }
#locks { font-size: 10px; color: var(--dim); letter-spacing: 1px; }

/* scope */
#scope { grid-column: 1; display: grid; grid-template-rows: auto minmax(120px, 30%) 22px 1fr; min-height: 0; --accent: var(--cyan); }
.tabs { display: flex; gap: 4px; padding: 8px 10px 6px; align-items: center; flex-wrap: wrap; }
.tab { font-family: var(--disp); font-size: 10px; letter-spacing: 2px; color: var(--dim); padding: 4px 9px; border: 1px solid transparent; border-radius: 2px; cursor: pointer; user-select: none; }
.tab.on { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,240,255,.35); }
.tab .n { color: var(--pink); margin-left: 4px; }
canvas.fill { width: 100%; height: 100%; display: block; }
#spec, #fall { cursor: crosshair; }
#hover { position: absolute; pointer-events: none; z-index: 4; font-size: 11px; color: var(--text); background: rgba(4,6,12,.9);
  border: 1px solid var(--cyan); padding: 3px 7px; border-radius: 2px; display: none; white-space: nowrap; }

/* side */
#side { grid-column: 2; display: grid; grid-template-rows: auto 1fr; min-height: 0; --accent: var(--green); }
.scroll { overflow-y: auto; min-height: 0; padding: 0 8px 8px; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: linear-gradient(var(--cyan), var(--pink)); border-radius: 4px; }
.bm { display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; padding: 5px 4px; border-bottom: 1px dashed var(--line); font-size: 12px; cursor: pointer; }
.bm:hover { background: rgba(0,240,255,.07); }
.bm .f { font-family: var(--disp); font-size: 12px; color: var(--cyan); }
.bm .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm .l i { font-style: normal; color: var(--dim); font-size: 10px; display: block; overflow: hidden; text-overflow: ellipsis; }
.bm .c { font-size: 10px; color: var(--dim); text-align: right; }
.bm .c b { color: var(--pink); }
.catch { border-bottom: 1px dashed var(--line); padding: 7px 4px; font-size: 12px; }
.catch .top { display: flex; gap: 8px; align-items: baseline; }
.catch .f { font-family: var(--disp); font-size: 12px; color: var(--cyan); }
.kind { font-size: 9px; letter-spacing: 1.5px; padding: 1px 6px; border-radius: 2px; border: 1px solid; }
.kind.voice { color: var(--green); } .kind.data { color: var(--yellow); } .kind.carrier { color: var(--purple); }
.catch .when { margin-left: auto; color: var(--dim); font-size: 10px; }
.catch .tr { color: var(--text); margin: 4px 0; font-style: italic; }
.catch img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 2px; margin-top: 4px; cursor: pointer; }
.catch .play { font-size: 10px; margin-top: 4px; }
.nights { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.nights img { width: 100%; border: 1px solid var(--line); cursor: pointer; }
#big { position: fixed; inset: 0; z-index: 70; background: rgba(4,6,12,.94); display: none; place-items: center; cursor: zoom-out; }
#big img { max-width: 96vw; max-height: 94vh; border: 1px solid var(--cyan); box-shadow: 0 0 30px rgba(0,240,255,.3); }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60; background: rgba(10,14,25,.95);
  border: 1px solid var(--cyan); color: var(--text); padding: 9px 18px; border-radius: 3px; font-size: 12px; letter-spacing: 1px;
  box-shadow: 0 0 18px rgba(0,240,255,.35); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="toast"></div>
<div id="big"><img alt=""></div>
<div id="app">
  <header>
    <div class="logo">KAIA<span>//</span>RX</div>
    <div class="pill"><span class="dot" id="dot"></span><b id="mode">—</b></div>
    <div class="pill">PASS <b id="pass">0</b></div>
    <div class="pill">GAIN <b id="gain">—</b></div>
    <div class="pill">NIGHTLY <b id="hours">—</b></div>
    <div class="pill" id="tunepill" style="display:none">TUNED <b id="tuneleft"></b></div>
    <div class="spacer"></div>
    <div id="clock">00:00:00</div>
  </header>

  <div class="panel" id="vfo">
    <div>
      <div class="ptitle">VFO · NBFM 12.5 kHz</div>
      <div id="freq">---.---.---<small>MHz</small></div>
      <div class="vsub" id="vsub">—</div>
    </div>
    <div class="meters">
      <div class="meter"><span>SIGNAL</span><canvas id="sm"></canvas><span class="v" id="smv">—</span></div>
      <div class="meter"><span>AUDIO</span><canvas id="am"></canvas><span class="v" id="amv">—</span></div>
      <div class="meter"><span>SQUELCH</span><canvas id="sq"></canvas><span class="v" id="sqv">—</span></div>
    </div>
    <div class="ctl">
      <div class="row"><span class="ptitle">TUNE FOR</span>
        <select id="mins"><option>5</option><option selected>15</option><option>30</option><option>60</option></select>
        <span class="ptitle">MIN</span></div>
      <div class="row"><div class="btn" id="scan" title="leave the tuned channel and go back to the scan">◀ BACK TO SCAN</div>
        <div class="btn pink" id="mon" title="hear the scanner in this window">🎧 MONITOR</div></div>
      <div class="row"><span class="ptitle">VOL</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.7"></div>
    </div>
  </div>

  <div class="panel" id="kaia">
    <div class="ptitle">KAIA ON THE DIAL</div>
    <div><div id="say">—</div><div id="locks"></div></div>
  </div>

  <div class="panel" id="scope">
    <div class="tabs" id="bands"></div>
    <canvas class="fill" id="spec"></canvas>
    <canvas class="fill" id="axis"></canvas>
    <canvas class="fill" id="fall"></canvas>
    <div id="hover"></div>
  </div>

  <div class="panel" id="side">
    <div class="tabs"><span class="tab on" data-t="catches">CATCHES</span><span class="tab" data-t="bm">BOOKMARKS</span><span class="tab" data-t="nights">NIGHTS</span></div>
    <div class="scroll" id="sidepane"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const MHZ = 1e6;
const LOW_DB = -6, SPAN_DB = 40;                 // rx_scope's colour scale
const STOPS = [[0, [4, 6, 12]], [0.25, [20, 28, 90]], [0.45, [110, 40, 190]], [0.62, [255, 47, 209]], [0.82, [0, 240, 255]], [1, [235, 250, 255]]];
const LUT = new Uint8ClampedArray(256 * 3);
for (let i = 0; i < 256; i++) {
  const x = i / 255; let k = 0; while (k < STOPS.length - 2 && x > STOPS[k + 1][0]) k++;
  const [a, ca] = STOPS[k], [b, cb] = STOPS[k + 1], t = (x - a) / (b - a);
  for (let c = 0; c < 3; c++) LUT[i * 3 + c] = ca[c] + (cb[c] - ca[c]) * t;
}
const COLS = 1024, ROWS = 360;
let S = null, bands = [], band = 0, ledger = [], catches = [], nightsList = [];
const falls = {};          // band -> {canvas, ctx, latest: Uint8Array}
const peak = new Float32Array(COLS).fill(0);
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), Math.max(2200, m.length * 45)); }
function esc(s) { return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const fmtF = (hz) => { const s = Math.round(hz).toString().padStart(9, "0"); return `${+s.slice(0, s.length - 6)}.${s.slice(-6, -3)}.${s.slice(-3)}`; };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [g, r.width, r.height];
}
function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

// ── waterfalls: one offscreen canvas per band, newest row on top ──
function fallOf(i) {
  if (!falls[i]) {
    const c = document.createElement("canvas"); c.width = COLS; c.height = ROWS;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#04060c"; ctx.fillRect(0, 0, COLS, ROWS);
    falls[i] = { canvas: c, ctx, latest: new Uint8Array(COLS) };
  }
  return falls[i];
}
function addRows(i, data, n) {
  const f = fallOf(i);
  f.ctx.drawImage(f.canvas, 0, n);                       // scroll down by n
  const img = f.ctx.createImageData(COLS, n);
  for (let r = 0; r < n; r++) {
    const src = (n - 1 - r) * COLS;                      // newest at the top
    for (let x = 0; x < COLS; x++) {
      const v = data[src + x], o = (r * COLS + x) * 4;
      img.data[o] = LUT[v * 3]; img.data[o + 1] = LUT[v * 3 + 1]; img.data[o + 2] = LUT[v * 3 + 2]; img.data[o + 3] = 255;
    }
  }
  f.ctx.putImageData(img, 0, 0);
  f.latest = data.slice((n - 1) * COLS, n * COLS);
}
function loadFall(i) { fetch("/waterfall/" + i).then((r) => r.json()).then((w) => { if (w.rows) addRows(i, b64(w.data), w.rows); }).catch(() => {}); }

// ── stream ──
function connect() {
  const es = new EventSource("/events");
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    if (!bands.length && S.bands.length) { bands = S.bands; buildTabs(); bands.forEach((b) => loadFall(b.i)); }
    for (const [i, r] of Object.entries(S.rows || {})) addRows(+i, b64(r.data), r.n);
    if (S.live && followBand) { const bi = bandOf(S.live.freq || S.live.center); if (bi !== null && bi !== band && S.mode !== "scanning") { band = bi; markTabs(); } }
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
let followBand = true;
function bandOf(f) { for (const b of bands) if (f >= b.lo && f < b.hi) return b.i; return null; }
function buildTabs() {
  $("bands").innerHTML = bands.map((b) => `<span class="tab" data-b="${b.i}">${esc(b.name.toUpperCase())}<span class="n" data-n="${b.i}"></span></span>`).join("");
  $("bands").querySelectorAll(".tab").forEach((t) => t.onclick = () => { band = +t.dataset.b; followBand = false; markTabs(); });
  markTabs();
}
function markTabs() { $("bands").querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", +t.dataset.b === band)); }

// ── drawing ──
const xOf = (b, f, W) => (f - b.lo) / (b.hi - b.lo) * W;
const fOf = (b, x, W) => b.lo + x / W * (b.hi - b.lo);
function drawScope() {
  const b = bands.find((x) => x.i === band); if (!b) return;
  const f = fallOf(band);
  // spectrum: the band's latest row, a peak hold, the live slice brighter
  const [g, W, H] = fit($("spec")); g.clearRect(0, 0, W, H);
  g.strokeStyle = "rgba(24,34,58,.9)"; g.lineWidth = 1;
  for (let db = 0; db <= SPAN_DB; db += 10) { const y = H - (db / SPAN_DB) * (H - 8); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.fillStyle = "#5d6b8f"; g.font = "9px JetBrains Mono"; g.fillText(`+${db + LOW_DB} dB`, 4, y - 2); }
  const yOf = (v) => H - v / 255 * (H - 8);
  for (let x = 0; x < COLS; x++) peak[x] = Math.max(f.latest[x], peak[x] - 0.6);
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, "rgba(0,240,255,.45)"); grad.addColorStop(1, "rgba(0,240,255,0)");
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x < COLS; x++) g.lineTo(x / COLS * W, yOf(f.latest[x]));
  g.lineTo(W, H); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); for (let x = 0; x < COLS; x++) { const X = x / COLS * W, Y = yOf(f.latest[x]); x ? g.lineTo(X, Y) : g.moveTo(X, Y); }
  g.strokeStyle = "#00f0ff"; g.lineWidth = 1.2; g.shadowColor = "#00f0ff"; g.shadowBlur = 6; g.stroke(); g.shadowBlur = 0;
  g.beginPath(); for (let x = 0; x < COLS; x++) { const X = x / COLS * W, Y = yOf(peak[x]); x ? g.lineTo(X, Y) : g.moveTo(X, Y); }
  g.strokeStyle = "rgba(255,47,209,.5)"; g.lineWidth = 1; g.stroke();
  const L = S && S.live;
  if (L && L.center >= b.lo - 1.2e6 && L.center <= b.hi + 1.2e6) {
    const sp = b64(L.spec), x0 = xOf(b, L.lo, W), x1 = xOf(b, L.hi, W);
    g.fillStyle = L.state === "hop" ? "rgba(0,240,255,.05)" : "rgba(255,47,209,.07)"; g.fillRect(x0, 0, x1 - x0, H);
    g.beginPath(); for (let k = 0; k < sp.length; k++) { const X = x0 + k / sp.length * (x1 - x0), Y = yOf(sp[k]); k ? g.lineTo(X, Y) : g.moveTo(X, Y); }
    g.strokeStyle = L.state === "hop" ? "rgba(235,250,255,.8)" : "#ff2fd1"; g.lineWidth = 1.4; g.stroke();
  }
  drawMarks(g, b, W, H, true);
  // waterfall
  const [wg, WW, WH] = fit($("fall")); wg.imageSmoothingEnabled = true;
  wg.drawImage(f.canvas, 0, 0, COLS, ROWS, 0, 0, WW, WH);
  drawMarks(wg, b, WW, WH, false);
  // axis
  const [ag, AW, AH] = fit($("axis")); ag.clearRect(0, 0, AW, AH); ag.fillStyle = "rgba(4,6,12,.9)"; ag.fillRect(0, 0, AW, AH);
  const span = b.hi - b.lo, step = [100e3, 250e3, 500e3, 1e6, 2e6, 5e6].find((s) => span / s <= 14);
  ag.font = "10px JetBrains Mono"; ag.fillStyle = "#5d6b8f"; ag.strokeStyle = "#2a3554";
  for (let fq = Math.ceil(b.lo / step) * step; fq <= b.hi; fq += step) { const X = xOf(b, fq, AW); ag.beginPath(); ag.moveTo(X, 0); ag.lineTo(X, 6); ag.stroke(); ag.fillText((fq / MHZ).toFixed(step < 1e6 ? 2 : 0), X + 3, 15); }
}
function drawMarks(g, b, W, H, labels) {
  // lockouts: the carriers being ignored
  for (const [fq, left] of (S && S.lockouts) || []) {
    if (fq < b.lo || fq > b.hi) continue;
    const X = xOf(b, fq, W), w = Math.max(3, 150e3 / (b.hi - b.lo) * W);
    g.fillStyle = "rgba(255,56,96,.10)"; g.fillRect(X - w / 2, 0, w, H);
  }
  // bookmarks
  if (labels) {
    g.font = "9px JetBrains Mono";
    for (const c of ledger) {
      if (c.freq < b.lo || c.freq > b.hi || !(c.voice || c.label)) continue;
      const X = xOf(b, c.freq, W);
      g.fillStyle = c.voice ? "#3dff8a" : "#5d6b8f"; g.beginPath(); g.moveTo(X - 3, 0); g.lineTo(X + 3, 0); g.lineTo(X, 5); g.fill();
    }
  }
  // what the watch is on
  const L = S && S.live, fq = L && L.state !== "hop" ? (L.freq || L.center) : null;
  if (fq && fq >= b.lo && fq <= b.hi) {
    const X = xOf(b, fq, W); g.strokeStyle = "#ff2fd1"; g.lineWidth = 2; g.shadowColor = "#ff2fd1"; g.shadowBlur = 10;
    g.beginPath(); g.moveTo(X, 0); g.lineTo(X, H); g.stroke(); g.shadowBlur = 0; g.lineWidth = 1;
  }
}
function bar(cv, frac, color) {
  const [g, W, H] = fit(cv); g.clearRect(0, 0, W, H);
  const n = 24, gap = 2, w = (W - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) { const on = i / n < frac; g.fillStyle = on ? (i > n * 0.8 ? "#ff3860" : i > n * 0.6 ? "#ffe45c" : color) : "rgba(42,53,84,.55)"; g.fillRect(i * (w + gap), 0, w, H); }
}
function updateVfo() {
  if (!S) return;
  const L = S.live, holding = L && L.state !== "hop";
  const f = S.freq || (L && L.center) || 0;
  $("freq").innerHTML = (f ? fmtF(f) : "---.---.---") + "<small>MHz</small>"; $("freq").classList.toggle("hold", !!holding);
  const ch = ledger.find((c) => Math.abs(c.freq - f) < 3000);
  $("vsub").innerHTML = holding ? `<b>${esc(ch ? (ch.label || ch.service) : "unlisted")}</b> · ${L.state.toUpperCase()}${ch ? ` · heard ${ch.hits}× · voice ${ch.voice}×` : ""}`
    : S.mode === "scanning" ? `sweeping · slice centre ${(f / MHZ).toFixed(3)} MHz` : esc(S.mode);
  const lvl = holding ? L.level : 0;
  bar($("sm"), Math.max(0, Math.min(1, lvl / 40)), "#3dff8a"); $("smv").textContent = holding ? `${lvl >= 0 ? "+" : "−"}${Math.abs(lvl).toFixed(0)} dB` : "—";
  bar($("am"), Math.max(0, Math.min(1, (S.audio_level + 60) / 60)), "#00f0ff"); $("amv").textContent = S.audio_level > -89 ? `${S.audio_level.toFixed(0)} dBFS` : "—";
  const open = holding && L.open;
  bar($("sq"), open ? 1 : 0, "#ff2fd1"); $("sqv").textContent = holding ? (open ? "OPEN" : "CLOSED") : "—";
  $("mode").textContent = S.mode.toUpperCase();
  $("dot").className = "dot " + (holding ? "hold" : S.mode === "scanning" ? "on" : "");
  $("pass").textContent = S.passes; $("gain").textContent = `${S.gain} dB`; $("hours").textContent = S.hours;
  $("tunepill").style.display = S.tuned ? "" : "none";
  if (S.tuned) $("tuneleft").textContent = `${(S.tuned.freq_hz / MHZ).toFixed(4)} · ${Math.max(0, Math.round((S.tuned.until - S.t) / 60))} min`;
  $("say").textContent = S.kaia;
  const locks = S.lockouts || [];
  $("locks").textContent = locks.length ? "locked out (constant carriers): " + locks.slice(0, 6).map(([fq, s]) => `${(fq / MHZ).toFixed(3)} · ${Math.round(s / 60)}m`).join("  ·  ") : "";
}

// ── tuning: click the spectrum or waterfall ──
function hoverAt(e, cv) {
  const b = bands.find((x) => x.i === band); if (!b) return null;
  const r = cv.getBoundingClientRect(); const f = fOf(b, e.clientX - r.left, r.width);
  return { b, f: Math.round(f / 2500) * 2500, x: e.clientX, y: e.clientY };
}
for (const id of ["spec", "fall"]) {
  const cv = $(id);
  cv.addEventListener("mousemove", (e) => {
    const h = hoverAt(e, cv); if (!h) return;
    const ch = ledger.find((c) => Math.abs(c.freq - h.f) < 6250);
    const hv = $("hover"), pr = $("scope").getBoundingClientRect();
    hv.style.display = "block"; hv.style.left = (h.x - pr.left + 12) + "px"; hv.style.top = (h.y - pr.top + 12) + "px";
    hv.textContent = `${(h.f / MHZ).toFixed(4)} MHz` + (ch ? ` · ${ch.label || ch.service} · voice ${ch.voice}×` : "") + " — click to tune";
  });
  cv.addEventListener("mouseleave", () => { $("hover").style.display = "none"; });
  cv.addEventListener("click", (e) => { const h = hoverAt(e, cv); if (h) tune(h.f); });
}
function tune(f) {
  toast(`tuning to ${(f / MHZ).toFixed(4)} MHz…`);
  fetch("/tune", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ freq: f, minutes: +$("mins").value }) })
    .then((r) => r.json()).then((j) => toast(j.say)).catch(() => toast("the tune didn't go through"));
}
$("scan").onclick = () => fetch("/scan", { method: "POST" }).then((r) => r.json()).then((j) => toast(j.say)).catch(() => {});

// ── the monitor: the scanner's audio in this window ──
let mon = null;
$("mon").onclick = () => { mon ? stopMon() : startMon(); };
async function startMon() {
  const ctx = new AudioContext({ sampleRate: 12000 }), gain = ctx.createGain(); gain.gain.value = +$("vol").value; gain.connect(ctx.destination);
  const ctl = new AbortController(); mon = { ctx, gain, ctl, at: 0 };
  $("mon").classList.add("lit"); toast("monitoring the scanner in this window");
  try {
    const r = await fetch("/audio", { signal: ctl.signal }), rd = r.body.getReader(); let carry = new Uint8Array(0);
    for (;;) {
      const { value, done } = await rd.read(); if (done || !mon) break;
      const buf = new Uint8Array(carry.length + value.length); buf.set(carry); buf.set(value, carry.length);
      const n = Math.floor(buf.length / 2); carry = buf.slice(n * 2);
      if (!n) continue;
      const s16 = new Int16Array(buf.buffer, buf.byteOffset, n), ab = ctx.createBuffer(1, n, 12000), ch = ab.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = s16[i] / 32768;
      const src = ctx.createBufferSource(); src.buffer = ab; src.connect(gain);
      if (mon.at < ctx.currentTime + 0.05 || mon.at > ctx.currentTime + 1.0) mon.at = ctx.currentTime + 0.15;
      src.start(mon.at); mon.at += n / 12000;
    }
  } catch (_) {}
}
function stopMon() { if (!mon) return; mon.ctl.abort(); mon.ctx.close(); mon = null; $("mon").classList.remove("lit"); }
$("vol").oninput = () => { if (mon) mon.gain.gain.value = +$("vol").value; };

// ── the side panel ──
let side = "catches";
document.querySelectorAll("#side .tab").forEach((t) => t.onclick = () => {
  side = t.dataset.t; document.querySelectorAll("#side .tab").forEach((x) => x.classList.toggle("on", x === t)); renderSide();
});
function renderSide() {
  const p = $("sidepane");
  if (side === "bm") {
    p.innerHTML = ledger.map((c) => `<div class="bm" data-f="${c.freq}"><span class="f">${(c.freq / MHZ).toFixed(4)}</span>` +
      `<span class="l">${esc(c.label || c.service || "found")}<i>${esc(c.service)}${c.hours ? " · " + esc(c.hours) : ""}${c.transcript ? " · “" + esc(c.transcript.slice(0, 60)) + "”" : ""}</i></span>` +
      `<span class="c"><b>${c.voice}</b> voice<br>${c.hits} heard</span></div>`).join("") || `<div style="color:var(--dim);padding:8px">the ledger is empty</div>`;
    p.querySelectorAll(".bm").forEach((el) => {
      el.onclick = () => { const f = +el.dataset.f, bi = bandOf(f); if (bi !== null) { band = bi; followBand = false; markTabs(); } };
      el.ondblclick = () => tune(+el.dataset.f);
      el.title = "click: show its band · double-click: tune to it";
    });
  } else if (side === "nights") {
    p.innerHTML = nightsList.length ? `<div class="nights">${nightsList.map((n) => `<img src="/night/${n}" data-n="${n}" title="${n}" loading="lazy">`).join("")}</div>`
      : `<div style="color:var(--dim);padding:8px;font-size:12px">no nights saved yet — the first night's waterfall is saved when the scan ends</div>`;
    p.querySelectorAll("img").forEach((im) => im.onclick = () => big("/night/" + im.dataset.n));
  } else {
    p.innerHTML = catches.map((c) => `<div class="catch"><div class="top"><span class="f">${(c.freq / MHZ).toFixed(4)}</span><span class="kind ${c.kind}">${c.kind.toUpperCase()}</span>` +
      `<span style="font-size:11px;color:var(--dim)">${esc(c.label)}</span><span class="when">${new Date(c.ts * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })} · ${Math.round(c.seconds || 0)}s</span></div>` +
      (c.transcript ? `<div class="tr">“${esc(c.transcript)}”</div>` : "") +
      `<img src="/spec/${c.clip}" loading="lazy" data-c="${c.clip}" alt="">` +
      `<audio class="play" controls preload="none" src="/clip/${c.clip}" style="width:100%;height:28px"></audio></div>`).join("")
      || `<div style="color:var(--dim);padding:8px;font-size:12px">nothing kept yet</div>`;
    p.querySelectorAll("img").forEach((im) => im.onclick = () => big("/spec/" + im.dataset.c));
  }
}
function big(src) { $("big").querySelector("img").src = src; $("big").style.display = "grid"; }
$("big").onclick = () => { $("big").style.display = "none"; };
function loadSide() {
  Promise.all([fetch("/ledger").then((r) => r.json()), fetch("/catches").then((r) => r.json()), fetch("/nights").then((r) => r.json())])
    .then(([l, c, n]) => {
      const changed = JSON.stringify(c.map((x) => x.id)) !== JSON.stringify(catches.map((x) => x.id)) || l.length !== ledger.length || n.length !== nightsList.length;
      ledger = l; catches = c; nightsList = n;
      if (changed) { const st = $("sidepane").scrollTop; renderSide(); $("sidepane").scrollTop = st; }
      for (const b of bands) { const k = l.filter((x) => x.freq >= b.lo && x.freq < b.hi && x.voice).length; const el = document.querySelector(`[data-n="${b.i}"]`); if (el) el.textContent = k ? `·${k}` : ""; }
    }).catch(() => {});
}
setInterval(loadSide, 15000);

function frame() {
  try { $("clock").textContent = new Date().toTimeString().slice(0, 8); if (S) { updateVfo(); drawScope(); } } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
connect(); loadSide(); requestAnimationFrame(frame);
</script>
</body>
</html>
