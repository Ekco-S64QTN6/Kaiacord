name: Quality gate

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Neither tool needs the project's dependencies: ruff reads source, and
      # the type ratchet does not follow imports. Versions are pinned so a new
      # release cannot turn an unrelated change red.
      - name: Install ruff and mypy
        run: python -m pip install --no-input --disable-pip-version-check ruff==0.17.4 mypy==2.4.1
      - name: Lint (error rules, whole repository)
        run: ruff check --output-format=github .
      - name: Type ratchet (changed utils files may not gain mypy errors)
        run: python tools/maintenance/type_ratchet.py
      - name: Report style findings (informational)
        if: always()
        run: |
          {
            echo "## Style findings (informational, not a gate)"
            echo
            echo '```'
            ruff check --select E4,E7,E9,F --statistics --exit-zero utils tools .github
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
