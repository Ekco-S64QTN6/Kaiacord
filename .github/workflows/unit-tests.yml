name: Unit tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Import/config scaffolding only. CI must not receive live service keys.
      DISCORD_TOKEN: "test-discord-token"
      TERM: "xterm-256color"
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_DIFF_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg test binary
        timeout-minutes: 3
        run: |
          python -m pip install --no-input --disable-pip-version-check imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version
      - name: Ensure system test dependencies
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! ldconfig -p 2>/dev/null | grep -q 'libopus[.]so'; then
            sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get install --yes --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 libopus0
          fi
      - name: Install Python dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --no-input --disable-pip-version-check --upgrade pip
          python -m pip install --no-input --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
          if ! grep -qiE '^[[:space:]]*scipy([<=>!~[:space:]]|$)' requirements.txt; then
            python -m pip install --no-input --disable-pip-version-check "scipy>=1.15.0"
          fi
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run focused offline tests
        timeout-minutes: 5
        run: python .github/scripts/run_ci_tests.py
