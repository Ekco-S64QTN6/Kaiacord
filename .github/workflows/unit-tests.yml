name: Unit tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libopus0 libopus-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run the standard non-GPU suite
        run: python -m pytest -q -m "not ollama and not gpu and not slow"
