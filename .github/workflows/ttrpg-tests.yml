name: RPG unit tests

on:
  pull_request:
    paths:
      - "utils/ttrpg/**"
      - "tools/tests/unit/ttrpg/**"
      - ".github/workflows/ttrpg-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "utils/ttrpg/**"
      - "tools/tests/unit/ttrpg/**"
      - ".github/workflows/ttrpg-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpg-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fake import/config token only; CI never uses live service credentials.
      DISCORD_TOKEN: "test-discord-token"
      TERM: "xterm-256color"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg test binary
        timeout-minutes: 3
        run: |
          python -m pip install --no-input --disable-pip-version-check imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version

      - name: Ensure system test dependencies
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! ldconfig -p 2>/dev/null | grep -q 'libopus[.]so'; then
            # The Python wheel supplies FFmpeg. Install only the small runtime
            # library from apt instead of downloading FFmpeg's large dependency tree.
            sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get install --yes --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 libopus0
          fi
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
          # Keep this fallback until requirements.txt declares SciPy on main.
          if ! grep -qiE '^[[:space:]]*scipy([<=>!~[:space:]]|$)' requirements.txt; then
            python -m pip install "scipy>=1.15.0"
          fi
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run RPG unit tests
        run: python -m pytest -q tools/tests/unit/ttrpg
