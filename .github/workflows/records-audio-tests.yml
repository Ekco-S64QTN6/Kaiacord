name: Records audio tests

on:
  push:
    branches: ["**"]
    paths:
      - "utils/audio/records.py"
      - "utils/audio/library.py"
      - "utils/audio/setlist.py"
      - "tools/tests/unit/test_records.py"
      - "tools/tests/unit/test_setlist.py"
      - "tools/tests/unit/test_mixcheck.py"
      - "config/default_config.yaml"
      - ".github/workflows/records-audio-tests.yml"
  pull_request:
    paths:
      - "utils/audio/records.py"
      - "utils/audio/library.py"
      - "utils/audio/setlist.py"
      - "tools/tests/unit/test_records.py"
      - "tools/tests/unit/test_setlist.py"
      - "tools/tests/unit/test_mixcheck.py"
      - "config/default_config.yaml"
      - ".github/workflows/records-audio-tests.yml"

permissions:
  contents: read

jobs:
  records-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audio test dependencies
        timeout-minutes: 4
        run: |
          python -m pip install --no-input --disable-pip-version-check imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version
          python -m pip install --no-input --disable-pip-version-check --upgrade pip
          python -m pip install --no-input --disable-pip-version-check pytest pytest-asyncio numpy scipy PyYAML
      - name: Test records, set ranking and measured blends
        run: >-
          python -m pytest
          tools/tests/unit/test_records.py
          tools/tests/unit/test_setlist.py
          tools/tests/unit/test_mixcheck.py
          -q
