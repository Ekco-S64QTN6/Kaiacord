name: Dependency audit

# Advisories are published on their own schedule, so this runs weekly and
# whenever the requirements change, never as a check on an unrelated change.
on:
  # Changes are pushed straight to main, so a push audits too (report-only:
  # dependency_audit_report.py blocks only a pull request).
  push:
    branches: ["main"]
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
      - "tools/maintenance/dependency_audit_report.py"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
      - "tools/maintenance/dependency_audit_report.py"
      - "tools/tests/unit/test_dependency_audit_report.py"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --no-input --disable-pip-version-check pip-audit==2.10.1
      # Run once and preserve the structured result. The following step owns
      # the policy: blocking for PRs, report-only for weekly/manual runs.
      - name: Audit requirements.txt
        id: audit
        continue-on-error: true
        run: |
          rm -f pip-audit.json
          pip-audit -r requirements.txt --progress-spinner off --desc off -f json -o pip-audit.json
      - name: Enforce PR policy and publish summary
        if: always()
        run: |
          python tools/maintenance/dependency_audit_report.py \
            --input pip-audit.json \
            --markdown pip-audit.md \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --audit-outcome "${{ steps.audit.outcome }}" \
            --event-name "${{ github.event_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: |
            pip-audit.json
            pip-audit.md
          if-no-files-found: warn
