name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install full requirements so module imports pass during pytest collection
          pip install -r requirements.txt
          pip install pytest pytest-asyncio colorama

      - name: Static syntax analysis
        run: |
          python tools/tests/unit/static_analysis.py

      - name: Unit tests
        run: |
          pytest tools/tests/unit/ -v --tb=short --ignore=tools/tests/unit/test_performance_bench.py
        env:
          # Prevent tests from trying to connect to real services
          KAIACORD_TEST_MODE: "1"
